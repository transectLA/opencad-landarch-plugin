[package]
name = "landarch"
version = "0.0.2"
edition = "2021"
description = "Landscape architecture design and construction documentation tools for Open CAD Studio."
license = "GPL-3.0-only"

[lib]
crate-type = ["cdylib"]

[dependencies]
ocs_plugin_api = { git = "https://github.com/HakanSeven12/OpenCADStudio", features = ["host"] }

[patch.crates-io]
acadrust = { git = "https://github.com/HakanSeven12/acadrust", branch = "main" }
