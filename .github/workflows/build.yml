name: Land Arch Tools Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust version
        run: rustc --version

      - name: Cargo check
        run: cargo check --workspace

      - name: Cargo test
        run: cargo test --workspace

      - name: Build release plugin
        run: cargo build --release

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: landarch-${{ runner.os }}
          path: |
            target/release/*.dll
            target/release/*.so
            target/release/*.dylib
            plugin.toml
